name: Daily Government Job Auto-Poster (4x Daily)

on:
  schedule:
    # Runs 4 times a day (every 6 hours)
    - cron: '0 0 * * *'   # 05:30 AM IST (Morning Fresh Batch)
    - cron: '0 6 * * *'   # 11:30 AM IST (Noon Fresh Batch)
    - cron: '0 12 * * *'  # 05:30 PM IST (Evening Fresh Batch)
    - cron: '0 18 * * *'  # 11:30 PM IST (Night Fresh Batch)
  workflow_dispatch: # Allows manual 1-click Run button in GitHub

# Required write permissions to save jobs_history.json
permissions:
  contents: write

jobs:
  run-daily-job-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Job Bot & Auto-Publish via Google Blogger API
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTS_PER_RUN: "12"
        run: |
          python job/blogger_api_auto_poster.py

      - name: Commit & Push Updated Job History & XML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job/jobs_history.json job/daily_jobs_export.xml || true
          (git commit -m "Auto-update daily job posts [skip ci]" && git push origin main) || echo "Workflow finished successfully"
